<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#12141A">
<title>The Wire — The Breakdown | Grade 11 History</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Source+Sans+3:wght@300;400;600;700&family=JetBrains+Mono:wght@400;600&display=swap');
:root{
  --bg:#12141A;--card:#1A1D26;--border:#282C38;--border2:#363C4C;
  --dim:#5C6478;--mid:#8890A8;--light:#B8C0D4;--bright:#D8DEF0;--white:#F0F2FA;
  --red:#E04848;--red-bg:rgba(224,72,72,.08);--red-glow:rgba(224,72,72,.15);
  --green:#40C870;--green-bg:rgba(64,200,112,.08);
  --blue:#5088E0;--blue-bg:rgba(80,136,224,.08);
  --amber:#E0A830;--amber-bg:rgba(224,168,48,.08);
  --acc:#E04848;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{min-height:100vh;background:var(--bg);color:var(--light);font-family:'Source Sans 3',sans-serif;line-height:1.7;overflow-x:hidden;}
.c{max-width:640px;margin:0 auto;padding:1rem;}

/* HUD */
.hud{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(18,20,26,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:.5rem 1rem;}
.hud-inner{max-width:640px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;}
.hud-rank{font-family:'JetBrains Mono',monospace;font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--acc);}
.hud-xp-wrap{width:100px;height:4px;background:var(--border);border-radius:2px;overflow:hidden;margin-left:.6rem;}
.hud-xp-bar{height:100%;background:var(--acc);border-radius:2px;transition:width .5s ease;}
.hud-right{display:flex;align-items:center;gap:.8rem;}
.hud-streak{font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--dim);}
.hud-streak.hot{color:var(--amber);}.hud-streak.fire{color:var(--red);}
.hud-xp{font-family:'JetBrains Mono',monospace;font-size:.6rem;color:var(--dim);}
.xp-pop{position:fixed;top:40%;left:50%;transform:translate(-50%,0);font-family:'JetBrains Mono',monospace;font-size:1.5rem;font-weight:600;color:var(--green);pointer-events:none;z-index:200;animation:xpUp 1s ease-out forwards;}
@keyframes xpUp{0%{opacity:1;transform:translate(-50%,0) scale(.8);}60%{opacity:1;transform:translate(-50%,-30px) scale(1.1);}100%{opacity:0;transform:translate(-50%,-50px) scale(.9);}}
.lvl-up{position:fixed;inset:0;background:rgba(18,20,26,.95);display:flex;align-items:center;justify-content:center;z-index:300;animation:fadeIn .3s ease;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}

/* Progress */
.prog{display:flex;gap:.25rem;margin-bottom:1rem;padding-top:2rem;}
.prog-dot{flex:1;height:3px;background:var(--border);border-radius:2px;}
.prog-dot.done{background:var(--green);}.prog-dot.active{background:var(--acc);}.prog-dot.up{background:var(--border);}

/* Labels */
.sec-label{font-family:'JetBrains Mono',monospace;font-size:.6rem;letter-spacing:.25em;text-transform:uppercase;color:var(--dim);margin-bottom:.6rem;}
.warning-label{font-family:'JetBrains Mono',monospace;font-size:.6rem;letter-spacing:.25em;text-transform:uppercase;color:var(--red);margin-bottom:.6rem;}

/* Card */
.card{background:var(--card);border:1px solid var(--border);padding:1.3rem 1.4rem;margin-bottom:1rem;}
.card p{font-size:1.1rem;line-height:1.8;color:var(--light);}
.card p+p{margin-top:.7rem;}
.card strong{color:var(--white);font-weight:600;}

/* Alert card — red-tinted for crisis moments */
.alert-card{background:rgba(224,72,72,.04);border:1px solid rgba(224,72,72,.15);border-left:3px solid var(--red);padding:1.3rem 1.4rem;margin-bottom:1rem;}
.alert-card p{font-size:1.05rem;line-height:1.8;color:var(--light);}
.alert-card strong{color:var(--white);}

/* Source box */
.source{background:var(--bg);border:1px solid var(--border);padding:1.2rem;margin:1rem 0;position:relative;}
.source::before{content:'SOURCE';position:absolute;top:-.5rem;left:1rem;background:var(--bg);padding:0 .5rem;font-family:'JetBrains Mono',monospace;font-size:.55rem;letter-spacing:.3em;color:var(--acc);}
.source-attr{font-family:'JetBrains Mono',monospace;font-size:.65rem;color:var(--dim);margin-bottom:.6rem;line-height:1.5;}
.source-text{font-family:'DM Serif Display',Georgia,serif;font-size:1.05rem;line-height:1.8;color:var(--bright);font-style:italic;border-left:2px solid var(--border);padding-left:1rem;}

/* Side-by-side sources */
.sources-split{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin:1rem 0;}
.source-half{background:var(--card);border:1px solid var(--border);padding:1rem;position:relative;}
.source-half.west{border-top:2px solid var(--blue);}
.source-half.east{border-top:2px solid var(--red);}
.source-half-label{font-family:'JetBrains Mono',monospace;font-size:.55rem;letter-spacing:.2em;text-transform:uppercase;margin-bottom:.4rem;}
.source-half.west .source-half-label{color:var(--blue);}
.source-half.east .source-half-label{color:var(--red);}
.source-half-text{font-family:'DM Serif Display',Georgia,serif;font-size:.9rem;line-height:1.7;color:var(--bright);font-style:italic;}
@media(max-width:500px){.sources-split{grid-template-columns:1fr;}}

/* Who said it — rapid fire */
.wsi-quote{font-family:'DM Serif Display',Georgia,serif;font-size:clamp(1.1rem,3vw,1.4rem);color:var(--white);line-height:1.5;text-align:center;padding:1rem .5rem;font-style:italic;margin-bottom:1rem;}
.wsi-btns{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;}
.wsi-btn{padding:1rem;font-family:'JetBrains Mono',monospace;font-size:.9rem;font-weight:600;letter-spacing:.05em;border:2px solid var(--border2);background:var(--card);color:var(--light);cursor:pointer;transition:all .15s;text-align:center;}
.wsi-btn:active{transform:scale(.97);}
.wsi-btn.churchill:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-bg);}
.wsi-btn.stalin:hover{border-color:var(--red);color:var(--red);background:var(--red-bg);}
.wsi-btn.correct{border-color:var(--green);background:var(--green-bg);color:var(--green);}
.wsi-btn.wrong{border-color:var(--red);background:var(--red-bg);color:var(--red);}
.wsi-btn.off{pointer-events:none;opacity:.3;}
.wsi-fb{text-align:center;padding:.7rem;margin-top:.6rem;font-size:.9rem;line-height:1.6;color:var(--light);}
.wsi-fb strong{color:var(--white);}

/* Sort */
.sort-item{background:var(--card);border:1px solid var(--border);padding:.7rem .9rem;margin-bottom:.4rem;display:flex;align-items:center;gap:.6rem;cursor:grab;user-select:none;transition:all .2s;}
.sort-item:active{cursor:grabbing;background:var(--border);border-color:var(--acc);}
.sort-handle{font-family:'JetBrains Mono',monospace;font-size:.8rem;color:var(--dim);flex-shrink:0;}
.sort-text{font-size:.9rem;color:var(--light);flex:1;line-height:1.4;}
.sort-arrows{display:flex;flex-direction:column;gap:2px;margin-left:auto;flex-shrink:0;}
.sort-arr{background:var(--border);border:none;color:var(--dim);font-size:.7rem;padding:3px 10px;cursor:pointer;line-height:1;}
.sort-arr:hover{background:var(--red-bg);color:var(--acc);}

/* MCQ */
.mcq-badge{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:.55rem;letter-spacing:.15em;text-transform:uppercase;padding:.2rem .5rem;margin-bottom:.6rem;}
.mcq-badge.analyse{background:rgba(160,80,200,.1);color:#B060E0;}
.mcq-badge.evaluate{background:var(--red-bg);color:var(--red);}
.mcq-q{font-family:'DM Serif Display',Georgia,serif;font-size:1.05rem;color:var(--white);line-height:1.5;margin-bottom:.8rem;}
.mcq-timer{display:flex;align-items:center;gap:.5rem;margin-bottom:.8rem;}
.mcq-timer-bg{flex:1;height:5px;background:var(--border);border-radius:3px;overflow:hidden;}
.mcq-timer-bar{height:100%;border-radius:3px;transition:width .25s linear;}
.mcq-timer-bar.ok{background:var(--green);}.mcq-timer-bar.warn{background:var(--amber);}.mcq-timer-bar.crit{background:var(--red);animation:tfl .4s ease infinite;}
@keyframes tfl{50%{opacity:.4;}}
.mcq-timer-num{font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--mid);min-width:2rem;text-align:right;}
.mcq-opt{display:block;width:100%;text-align:left;background:var(--bg);border:1px solid var(--border);color:var(--light);padding:.8rem .9rem .8rem 2.4rem;margin-bottom:.4rem;font-size:.95rem;line-height:1.5;cursor:pointer;transition:all .2s;position:relative;}
.mcq-opt::before{content:attr(data-l);position:absolute;left:.8rem;top:50%;transform:translateY(-50%);font-family:'JetBrains Mono',monospace;font-size:.65rem;color:var(--dim);font-weight:600;}
.mcq-opt:hover:not(.lk){border-color:var(--acc);color:var(--white);}
.mcq-opt.sel{border-color:var(--acc);background:var(--red-bg);color:var(--white);}
.mcq-opt.cr{border-color:var(--green);background:var(--green-bg);color:var(--white);}
.mcq-opt.cr::after{content:'✓';position:absolute;right:.8rem;top:50%;transform:translateY(-50%);color:var(--green);}
.mcq-opt.wr{border-color:var(--red);background:var(--red-bg);color:var(--dim);text-decoration:line-through;}
.mcq-opt.lk{cursor:default;}
.mcq-fb{background:var(--card);border:1px solid var(--border);border-left:3px solid var(--green);padding:.9rem 1rem;margin-top:.7rem;font-size:.92rem;line-height:1.7;color:var(--light);}
.mcq-fb.wrong{border-left-color:var(--red);}
.mcq-fb strong{color:var(--white);}
.mcq-tip{margin-top:.5rem;padding-top:.5rem;border-top:1px solid var(--border);font-size:.82rem;color:var(--amber);font-style:italic;}
.mcq-tip::before{content:'⚡ EXAM TIP: ';font-style:normal;font-weight:600;}

/* Terms */
.terms-label{font-family:'JetBrains Mono',monospace;font-size:.7rem;letter-spacing:.15em;text-transform:uppercase;color:var(--mid);margin-top:1rem;margin-bottom:.4rem;}
.terms-wrap{display:flex;flex-wrap:wrap;gap:.4rem;}
.term-tag{background:var(--card);border:1px solid var(--border);padding:.35rem .6rem;font-family:'JetBrains Mono',monospace;font-size:.72rem;color:var(--acc);cursor:pointer;transition:all .2s;}
.term-tag:hover{border-color:var(--acc);background:var(--red-bg);}
.term-tag::after{content:' ⓘ';font-size:.6rem;opacity:.5;}
.term-def{background:var(--card);border:1px solid var(--border);border-left:3px solid var(--acc);padding:.8rem 1rem;margin-top:.5rem;font-size:.95rem;line-height:1.7;color:var(--light);display:none;}
.term-def.vis{display:block;animation:tIn .3s ease;}
.term-def strong{color:var(--white);}
@keyframes tIn{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:translateY(0);}}

/* Buttons */
.btn-p{display:inline-block;background:var(--acc);color:var(--white);border:none;padding:.7rem 1.5rem;font-family:'Source Sans 3',sans-serif;font-size:.95rem;font-weight:600;cursor:pointer;transition:all .2s;text-decoration:none;}
.btn-p:hover{filter:brightness(1.15);transform:translateY(-1px);}.btn-p:disabled{opacity:.4;cursor:not-allowed;transform:none;}
.btn-s{display:inline-block;background:transparent;color:var(--dim);border:1px solid var(--border);padding:.6rem 1.2rem;font-family:'Source Sans 3',sans-serif;font-size:.85rem;cursor:pointer;transition:all .2s;}
.btn-s:hover{color:var(--white);border-color:var(--mid);}
.nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:1rem;}

/* End */
.end-scores{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin:1rem 0;}
.end-sc{background:var(--card);border:1px solid var(--border);padding:.8rem .4rem;text-align:center;}
.end-sc-num{font-family:'DM Serif Display',Georgia,serif;font-size:1.8rem;color:var(--white);}
.end-sc-label{font-family:'JetBrains Mono',monospace;font-size:.5rem;letter-spacing:.15em;text-transform:uppercase;color:var(--dim);margin-top:.2rem;}

@media(max-width:500px){.c{padding:.7rem;}}

/* === MOBILE OPTIMISATIONS === */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
*{-webkit-tap-highlight-color:transparent;}
body{min-height:100dvh;padding-bottom:env(safe-area-inset-bottom);}
button,a,.btn-p,.btn-s,.ready-btn,.mcq-opt{touch-action:manipulation;}
.hud{padding-top:max(.5rem,env(safe-area-inset-top));padding-left:max(1rem,env(safe-area-inset-left));padding-right:max(1rem,env(safe-area-inset-right));}
@media (hover:none){
  .btn-p:hover,.btn-s:hover,.ready-btn:hover,.mcq-opt:hover{transform:none;filter:none;}
}
@media (max-width:500px){
  .btn-p,.btn-s,.ready-btn,.mcq-opt{min-height:44px;}
  .mcq-opt{font-size:1rem;padding:.9rem 1rem .9rem 2.5rem;}
  .source-half-label,.mcq-badge,.end-sc-label,.chunk-label{font-size:.62rem;}
}
</style>
</head>
<body>
<div id="hud-el"></div>
<div class="c" id="app"></div>
<script>
var LVLS=[{name:'RECRUIT',xp:0},{name:'ANALYST',xp:40},{name:'AGENT',xp:100},{name:'OPERATIVE',xp:180},{name:'DIRECTOR',xp:280}];
var params=new URLSearchParams(window.location.search);
var xp=parseInt(params.get('xp'))||0,streak=parseInt(params.get('streak'))||0,bestStreak=Math.max(streak,parseInt(params.get('best'))||0),lvl=parseInt(params.get('lvl'))||0,lvlShown=lvl;
var app=document.getElementById('app'),hudEl=document.getElementById('hud-el');

var SEQ=[
  {type:'intro'},
  {type:'wsi'}, // Who Said It recall
  {type:'content',label:'POTSDAM · JULY 1945',cls:'alert-card',body:'<p>Five months after Yalta, the world had changed. <strong>Roosevelt was dead</strong> — replaced by Harry Truman, a hardline anti-communist who had no interest in accommodating Stalin. Churchill had lost Britain\'s election. <strong>Stalin was the only original member of the alliance left.</strong></p><p>With Germany defeated, the common enemy that held the alliance together was gone. And without it, every underlying tension surfaced.</p>',terms:[{t:'Potsdam Conference',d:'The third and final wartime conference (July 1945). Truman replaced Roosevelt, Attlee replaced Churchill. The atmosphere was hostile — the alliance was already cracking.'},{t:'Harry Truman',d:'Roosevelt\'s vice-president, became president after Roosevelt\'s death in April 1945. A hardline anti-communist who took a much more confrontational approach to Stalin than Roosevelt had.'}]},
  {type:'content',label:'⚠ THREE FACTORS THAT DESTROYED THE ALLIANCE',cls:'alert-card',body:'<p><strong>1. The atomic bomb.</strong> The USA developed and tested nuclear weapons without telling the USSR — then dropped them on Japan. Stalin saw this as intimidation, not just a military decision. He immediately ordered Soviet scientists to build their own bomb.</p><p><strong>2. Broken promises.</strong> At Yalta, Stalin had agreed to free elections in Eastern Europe. At Potsdam, the Red Army was still occupying these countries — and Stalin was installing communist governments instead. The West saw this as a deliberate betrayal.</p><p><strong>3. Reparations.</strong> Stalin demanded $10 billion from Germany to rebuild the devastated USSR. But the Soviet zone was the least industrialised part of Germany. Stalin felt cheated — the West had taken the productive regions.</p><p>These three factors did not operate in isolation. <strong>Each one made the others worse.</strong> Truman\'s hostility made Stalin less willing to compromise on elections. Stalin\'s broken promises made Truman more hostile. The bomb made everyone more paranoid.</p>',terms:[{t:'reparations',d:'Compensation payments demanded from a defeated country. Stalin wanted $10 billion from Germany to rebuild Soviet infrastructure destroyed in the war.'},{t:'satellite states',d:'Countries that were officially independent but in practice controlled by the USSR. By 1948: Albania, Bulgaria, East Germany, Romania, Poland, Hungary, Czechoslovakia.'}]},
  {type:'sort'}, // Rank the factors
  {type:'content',label:'SOVIET EXPANSION · 1946–1948',body:'<p>Between 1946 and 1948, Stalin systematically brought Eastern Europe under Soviet control. Despite his Yalta promise of free elections, he installed communist governments across the region, silencing any opposition.</p><p>By 1948: <strong>Albania, Bulgaria, East Germany, Romania, Poland, Hungary and Czechoslovakia</strong> — all under Soviet control. Churchill would call this the <strong>"Iron Curtain"</strong> — an imaginary line dividing capitalist Western Europe from communist Eastern Europe.</p><p>Stalin\'s justification? The USSR needed a <strong>"buffer zone"</strong> — friendly states between Soviet territory and Western Europe to prevent another invasion like Germany\'s devastating attack in 1941. From his perspective: self-defence. From the Western perspective: aggressive expansion.</p>',terms:[{t:'Iron Curtain',d:'Churchill\'s metaphor for the ideological boundary dividing capitalist Western Europe from communist Eastern Europe. It remained in place until 1989.'},{t:'buffer zone',d:'A belt of friendly states between the USSR and Western Europe. Stalin argued this was necessary to prevent another invasion — the West saw it as evidence of expansion.'}]},
  {type:'source_a'}, // Churchill
  {type:'mcq',badge:'analyse',time:25,question:'Churchill says "iron curtain," "ancient states," "famous cities." What is the effect of this language?',options:['He is using geographic precision to help his audience understand exactly which countries are now under Soviet control','He is choosing emotionally charged language — "iron curtain" implies something permanent and imprisoning, while "ancient" and "famous" makes the audience feel that European civilisation itself is under threat','He is deliberately echoing the language of wartime alliance to remind the audience that these countries were recently liberated together','He is using understated, restrained language to present his concerns without provoking a direct confrontation with the Soviet Union'],correct:1,feedback:'Option A sounds reasonable but misses the rhetorical strategy — Churchill is not trying to be <em>precise</em>, he is trying to be <em>persuasive</em>. Option C wrongly suggests he is echoing alliance language. Option D gets it exactly backwards — "iron curtain" is anything but restrained. <strong>Every word was chosen for maximum emotional impact.</strong>',tip:'"Churchill uses the metaphor to suggest Soviet control is permanent and imprisoning" = analysis. "Churchill says there is an iron curtain" = description. The exam rewards the first.'},
  {type:'source_b'}, // Stalin
  {type:'source_compare'}, // Side by side
  {type:'mcq',badge:'analyse',time:25,question:'Comparing Churchill and Stalin\'s statements, what do they reveal about how the Cold War was fought?',options:['Churchill is presenting evidence-based analysis of Soviet actions while Stalin relies on emotional personal attacks — showing the West had stronger arguments','Both leaders use carefully chosen language to frame the other as the aggressor — Churchill makes Soviet influence sound like imprisonment, Stalin makes Western criticism sound like warmongering','Stalin\'s response is more historically accurate because the USSR genuinely was invaded through Eastern Europe, making Churchill\'s criticism unfair','The two sources contradict each other completely, which means one must be lying and the other telling the truth about Eastern Europe'],correct:1,feedback:'Option A assumes Western rhetoric is "evidence-based" while Soviet rhetoric is "emotional" — but Churchill\'s "iron curtain" is <em>just as much</em> a rhetorical device as Stalin\'s Hitler comparison. Option C takes Stalin\'s argument at face value without questioning it. Option D assumes one must be "true" — <strong>both use real facts selectively</strong>.',tip:'Source comparison: (1) What does each argue? (2) What language techniques? (3) Why do they differ — different positions, audiences, purposes?'},
  {type:'mcq',badge:'evaluate',time:30,question:'A learner writes: "Source B is unreliable because it comes from Pravda, a communist newspaper." Is this strong evaluation?',options:['Yes — since Pravda only published government-approved content, it cannot provide accurate information about what actually happened in Eastern Europe','No — Pravda is valuable precisely because it reveals how the Soviet government wanted events to be understood, which is itself important historical evidence','Yes — historians should prioritise sources from democratic countries with a free press, because those are more likely to be balanced and accurate','No — all newspapers during the Cold War were equally biased, so Pravda should be treated with the same level of trust as any Western source from the same period'],correct:1,feedback:'Option A makes a logical error: state control means Pravda cannot give you an <em>objective</em> account, but it can give you the <em>official Soviet position</em> — which is exactly what a historian needs when studying Soviet propaganda. Option C assumes Western press is inherently balanced (it has its own biases). Option D overcorrects — Pravda was fundamentally different from an independent paper.',tip:'NEVER write "biased so unreliable." Instead: "Valuable for understanding the Soviet perspective because... Limited because it presents only the official view and does not include..."'},
  {type:'end'}
];

var pos=0,answers={},wsiIdx=0,wsiDone=false,wsiAnswers=[],sortOrder=null,sortDone=false,timer=null;
var totalScreens=SEQ.length;

// WSI data
var WSI_QUOTES=[
  {text:'"An iron curtain has descended across the continent."',answer:'churchill',context:'From the Fulton speech, March 1946'},
  {text:'"Mr Churchill now stands in the position of a warmonger."',answer:'stalin',context:'Published in Pravda, March 1946'},
  {text:'"Behind that line lie all the capitals of the ancient states of Central and Eastern Europe."',answer:'churchill',context:'Describing Soviet-controlled countries'},
  {text:'"Mr Churchill and his friends bear a striking resemblance to Hitler and his friends."',answer:'stalin',context:'Comparing Western criticism to Nazi aggression'}
];

function render(){
  clearInterval(timer);
  window.scrollTo({top:0,behavior:'auto'});
  var d=SEQ[pos];if(!d){pos=SEQ.length-1;d=SEQ[pos];}
  var rMap={intro:rIntro,wsi:rWSI,content:rContent,sort:rSort,source_a:rSourceA,source_b:rSourceB,source_compare:rSourceCompare,mcq:rMCQ,end:rEnd};
  (rMap[d.type]||function(){})();
  renderHUD();
}

function renderHUD(){
  var lv=LVLS[lvl],nxt=LVLS[lvl+1];
  var pct=nxt?Math.min(100,((xp-lv.xp)/(nxt.xp-lv.xp))*100):100;
  var sk=streak,skCl=sk>=5?'fire':sk>=3?'hot':'';
  var skTxt=sk>=3?'🔥'.repeat(Math.min(sk,5))+' '+sk:sk>0?'🔥 '+sk:'';
  hudEl.innerHTML='<div class="hud"><div class="hud-inner"><div style="display:flex;align-items:center;"><span class="hud-rank">'+lv.name+'</span><div class="hud-xp-wrap"><div class="hud-xp-bar" style="width:'+pct+'%"></div></div></div><div class="hud-right">'+(skTxt?'<span class="hud-streak '+skCl+'">'+skTxt+'</span>':'')+' <span class="hud-xp">'+xp+' XP</span></div></div></div>';
}
function addXP(n){xp+=n;var nl=0;for(var i=LVLS.length-1;i>=0;i--){if(xp>=LVLS[i].xp){nl=i;break;}}if(nl>lvl)lvl=nl;var el=document.createElement('div');el.className='xp-pop';el.textContent='+'+n+' XP';document.body.appendChild(el);setTimeout(function(){el.remove();},1100);if(lvl>lvlShown){lvlShown=lvl;var lv=LVLS[lvl];var o=document.createElement('div');o.className='lvl-up';o.innerHTML='<div style="text-align:center;"><div style="font-family:\'JetBrains Mono\',monospace;font-size:.6rem;letter-spacing:.3em;color:var(--dim);">CLEARANCE UPGRADED</div><div style="font-family:\'DM Serif Display\',Georgia,serif;font-size:2.5rem;color:var(--acc);margin:.3rem 0;">'+lv.name+'</div><button class="btn-p" onclick="this.closest(\'.lvl-up\').remove()">Continue</button></div>';document.body.appendChild(o);}renderHUD();}

function dots(){var h='<div class="prog">';for(var i=0;i<totalScreens-1;i++){h+='<div class="prog-dot '+(i<pos?'done':i===pos?'active':'up')+'"></div>';}return h+'</div>';}
function nav(can){var h='<div class="nav-row">';h+=pos>0?'<button class="btn-s" onclick="pos--;render();">← Back</button>':'<span></span>';h+='<button class="btn-p" onclick="pos++;render();" '+(can?'':'disabled')+'>Continue →</button>';return h+'</div>';}
function toggleTerm(id){var el=document.getElementById(id);if(!el)return;var p=el.parentNode;if(p){p.querySelectorAll('.term-def.vis').forEach(function(e){if(e!==el)e.classList.remove('vis');});}el.classList.toggle('vis');}
function renderTerms(terms,prefix){var h='<div class="terms-label">👇 Tap any term for its definition</div><div class="terms-wrap">';terms.forEach(function(t,i){h+='<span class="term-tag" onclick="toggleTerm(\''+prefix+'_'+i+'\')">'+t.t+'</span>';});h+='</div>';terms.forEach(function(t,i){h+='<div class="term-def" id="'+prefix+'_'+i+'"><strong>'+t.t+':</strong> '+t.d+'</div>';});return h;}

// === INTRO ===
function rIntro(){
  app.innerHTML=
    '<div style="min-height:85vh;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:2rem 0;">'+
    '<div style="font-family:\'JetBrains Mono\',monospace;font-size:.7rem;letter-spacing:.4em;text-transform:uppercase;color:var(--acc);margin-bottom:1.5rem;">THE WIRE · PART 3 OF 5</div>'+
    '<div style="font-family:\'DM Serif Display\',Georgia,serif;font-size:clamp(2.8rem,8vw,4rem);color:var(--white);line-height:1.1;margin-bottom:1.2rem;">The Breakdown</div>'+
    '<div style="font-size:1.15rem;color:var(--mid);max-width:480px;margin:0 auto;line-height:1.8;">Roosevelt is dead. Truman has the bomb. Stalin is breaking his promises. And Churchill is about to give the most famous speech of the Cold War.</div>'+
    '<div style="margin-top:2.5rem;"><button class="btn-p" onclick="pos++;render();" style="padding:1rem 3rem;font-size:1.1rem;">Enter the briefing →</button></div>'+
    '<div style="margin-top:1rem;font-family:\'JetBrains Mono\',monospace;font-size:.7rem;color:var(--dim);">First: who said what? Let\'s see if you can tell them apart.</div>'+
    '</div>';
}

// === WHO SAID IT ===
function rWSI(){
  if(wsiIdx>=WSI_QUOTES.length){wsiDone=true;}
  if(wsiDone){
    var correct=wsiAnswers.filter(function(a){return a.ok;}).length;
    var h=dots()+'<div class="card"><div class="sec-label">RECALL COMPLETE</div>';
    h+='<p style="font-size:1.05rem;"><strong>'+correct+'/'+WSI_QUOTES.length+'</strong> correct. '+(correct>=3?'You can tell them apart. Now let\'s dig into what they actually said and why.':'The sources can be tricky. Pay close attention to the language in this briefing.')+'</p></div>';
    h+='<div class="card"><div class="sec-label">QUICK RECAP FROM PART 2</div><p style="font-size:1rem;margin-bottom:.5rem;"><strong>Marriage of convenience</strong> — The USA-USSR alliance was based on necessity (defeating Hitler), not shared values.</p><p style="font-size:1rem;margin-bottom:.5rem;"><strong>Yalta (Feb 1945)</strong> — Big Three agreed: four zones for Germany, free elections in Eastern Europe, UN established.</p><p style="font-size:1rem;margin-bottom:.5rem;"><strong>20 million Soviet dead</strong> — Context for everything Stalin did next. Security fears, not just ideology.</p><p style="font-size:1rem;"><strong>Capitalism vs communism</strong> — Not just different systems, but fundamentally incompatible visions of society.</p></div>';
    h+=nav(true);
    app.innerHTML=h;return;
  }
  var q=WSI_QUOTES[wsiIdx],a=wsiAnswers[wsiIdx];
  var h=dots();
  h+='<div style="padding-top:.5rem;"><div style="font-family:\'JetBrains Mono\',monospace;font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--acc);margin-bottom:.3rem;text-align:center;">WHO SAID IT? · '+(wsiIdx+1)+'/'+WSI_QUOTES.length+'</div>';
  h+='<div class="wsi-quote">'+q.text+'</div>';
  if(!a){
    h+='<div class="wsi-btns"><button class="wsi-btn churchill" onclick="wsiAnswer(\'churchill\')">Churchill</button><button class="wsi-btn stalin" onclick="wsiAnswer(\'stalin\')">Stalin</button></div>';
  } else {
    var cCl=a.pick==='churchill'?(a.ok?'correct':'wrong'):(q.answer==='churchill'?'correct':'off');
    var sCl=a.pick==='stalin'?(a.ok?'correct':'wrong'):(q.answer==='stalin'?'correct':'off');
    h+='<div class="wsi-btns"><button class="wsi-btn churchill '+cCl+'" style="pointer-events:none;">Churchill</button><button class="wsi-btn stalin '+sCl+'" style="pointer-events:none;">Stalin</button></div>';
    h+='<div class="wsi-fb">'+(a.ok?'✓ Correct':'✗ That was <strong>'+(q.answer==='churchill'?'Churchill':'Stalin')+'</strong>')+' — '+q.context+'</div>';
    h+='<div style="text-align:center;margin-top:.8rem;"><button class="btn-p" onclick="wsiIdx++;render();" style="padding:.6rem 1.5rem;">Next →</button></div>';
  }
  h+='</div>';
  app.innerHTML=h;
}
function wsiAnswer(pick){
  var q=WSI_QUOTES[wsiIdx],ok=pick===q.answer;
  wsiAnswers[wsiIdx]={pick:pick,ok:ok};
  if(ok){streak++;if(streak>bestStreak)bestStreak=streak;addXP(5);}else{streak=0;}
  render();
}

// === CONTENT ===
function rContent(){
  var d=SEQ[pos];
  var cardCls=d.cls||'card';
  var h=dots()+'<div class="'+(d.cls==='alert-card'?'warning-label':'sec-label')+'">'+d.label+'</div><div class="'+cardCls+'">'+d.body+'</div>';
  if(d.terms)h+=renderTerms(d.terms,'t'+pos);
  h+=nav(true);
  app.innerHTML=h;
}

// === SORT ===
function rSort(){
  var items=['The atomic bomb — shifted the power balance and created mistrust','Change of leaders — Truman was hostile where Roosevelt was diplomatic','Broken promises — no free elections in Eastern Europe','Reparations disputes — arguments over Germany\'s wealth','Ideological divide — capitalism vs communism were always incompatible'];
  if(!sortOrder){sortOrder=items.map(function(_,i){return i;});for(var i=sortOrder.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=sortOrder[i];sortOrder[i]=sortOrder[j];sortOrder[j]=t;}}
  var h=dots()+'<div class="warning-label">RANK THE CAUSES</div>';
  h+='<div style="font-family:\'DM Serif Display\',Georgia,serif;font-size:1.05rem;color:var(--white);margin-bottom:.8rem;">Which factor was MOST important in breaking the alliance? Drag to rank — most important at top.</div>';
  sortOrder.forEach(function(idx,p){
    h+='<div class="sort-item"><span class="sort-handle">☰</span><span class="sort-text">'+items[idx]+'</span>';
    if(!sortDone)h+='<div class="sort-arrows"><button class="sort-arr" onclick="sortMove('+p+',-1)">▲</button><button class="sort-arr" onclick="sortMove('+p+',1)">▼</button></div>';
    h+='</div>';
  });
  if(!sortDone) h+='<div style="margin-top:.8rem;"><button class="btn-p" onclick="sortSubmit()">Lock in your ranking</button></div>';
  if(sortDone){
    h+='<div class="mcq-fb" style="border-left-color:var(--acc);">Historians disagree on this ranking. <strong>Orthodox</strong> historians put Soviet expansion first. <strong>Revisionists</strong> put the bomb and American aggression first. <strong>Post-revisionists</strong> say the ideological divide made breakdown inevitable. <strong>Your ranking reveals your interpretive framework</strong> — and knowing that is a History skill.</div>';
  }
  h+=nav(sortDone);
  app.innerHTML=h;
}
function sortMove(p,dir){var np=p+dir;if(np<0||np>=sortOrder.length)return;var t=sortOrder[p];sortOrder[p]=sortOrder[np];sortOrder[np]=t;render();}
function sortSubmit(){sortDone=true;addXP(15);render();}

// === SOURCES ===
function rSourceA(){
  var h=dots()+'<div class="source"><div class="source-attr">SOURCE A: Winston Churchill, speech at Westminster College, Fulton, Missouri, 5 March 1946. Former British PM, speaking with Truman\'s approval.</div><div class="source-text">"From Stettin in the Baltic to Trieste in the Adriatic, an iron curtain has descended across the continent. Behind that line lie all the capitals of the ancient states of Central and Eastern Europe... all these famous cities and the populations around them lie in what I must call the Soviet sphere."</div></div>';
  h+=renderTerms([{t:'Iron Curtain',d:'Churchill\'s metaphor for the ideological divide across Europe. Designed to sound permanent and imprisoning — like a prison wall made of iron.'},{t:'rhetoric',d:'The art of persuasive language. Churchill was one of the greatest rhetoricians of the 20th century — every word in this speech was chosen for maximum emotional impact.'}],'srcA');
  h+=nav(true);
  app.innerHTML=h;
}
function rSourceB(){
  var h=dots()+'<div class="source" style="border-color:rgba(224,72,72,.3);"><div class="source-attr">SOURCE B: Joseph Stalin, interview published in Pravda (official Soviet Communist Party newspaper), March 1946. His direct response to Churchill.</div><div class="source-text">"Mr Churchill now stands in the position of a warmonger... Mr Churchill and his friends bear a striking resemblance to Hitler and his friends... The Germans were able to make their invasion of the USSR through Finland, Poland, Romania, Bulgaria, and Hungary because governments hostile to the Soviet Union existed in these countries."</div></div>';
  h+=renderTerms([{t:'Pravda',d:'The official newspaper of the Soviet Communist Party. State-controlled — it published what the government approved. Valuable as evidence of the official Soviet position, not as objective reporting.'},{t:'buffer zone',d:'Stalin\'s justification for controlling Eastern Europe: friendly governments to prevent another invasion through those countries.'}],'srcB');
  h+=nav(true);
  app.innerHTML=h;
}

function rSourceCompare(){
  var h=dots()+'<div class="sec-label">SOURCES SIDE BY SIDE</div>';
  h+='<div class="sources-split">';
  h+='<div class="source-half west"><div class="source-half-label">SOURCE A · CHURCHILL</div><div class="source-half-text">"...an iron curtain has descended across the continent. Behind that line lie all the capitals of the ancient states..."</div></div>';
  h+='<div class="source-half east"><div class="source-half-label">SOURCE B · STALIN</div><div class="source-half-text">"Mr Churchill now stands in the position of a warmonger... The Germans invaded through these countries because hostile governments existed there."</div></div>';
  h+='</div>';
  h+='<div class="card" style="margin-top:.5rem;"><p style="font-size:1rem;">Same events. Same countries. <strong>Completely opposite framing.</strong> Churchill says the USSR is imprisoning Europe. Stalin says the West is warmongering. Both use real facts — both select them carefully.</p></div>';
  h+=nav(true);
  app.innerHTML=h;
}

// === MCQ ===
function rMCQ(){
  var d=SEQ[pos],a=answers[pos];
  var h=dots()+'<div class="card"><div class="mcq-badge '+d.badge+'">'+d.badge.toUpperCase()+(d.time?' · '+d.time+'S':'')+'</div>';
  if(d.time&&!a)h+='<div class="mcq-timer"><div class="mcq-timer-bg"><div class="mcq-timer-bar ok" id="mBar" style="width:100%"></div></div><span class="mcq-timer-num" id="mNum">'+d.time+'s</span></div>';
  h+='<div class="mcq-q">'+d.question+'</div>';
  var LL=['A','B','C','D'];
  if(!a){
    d.options.forEach(function(o,i){var sel=answers['tmp_'+pos]===i?' sel':'';h+='<button class="mcq-opt'+sel+'" data-l="'+LL[i]+'" onclick="mcqSel('+i+')">'+o+'</button>';});
    h+='<div style="margin-top:.6rem;"><button class="btn-p" onclick="mcqSub()" '+(answers['tmp_'+pos]===undefined?'disabled':'')+'>Submit</button></div>';
  } else {
    d.options.forEach(function(o,i){var cl='mcq-opt lk';if(i===d.correct)cl+=' cr';else if(a.sel===i&&!a.ok)cl+=' wr';h+='<button class="'+cl+'" data-l="'+LL[i]+'">'+o+'</button>';});
    h+='<div class="mcq-fb'+(a.ok?'':' wrong')+'">'+(a.timedOut?'⏱ TIME\'S UP. ':'')+d.feedback+'</div>';
    if(d.tip)h+='<div class="mcq-tip">'+d.tip+'</div>';
  }
  h+='</div>'+nav(!!a);
  app.innerHTML=h;
  if(d.time&&!a){var tl=d.time;timer=setInterval(function(){tl--;var b=document.getElementById('mBar'),n=document.getElementById('mNum');if(b&&n){var p=(tl/d.time)*100;b.style.width=p+'%';b.className='mcq-timer-bar'+(p<25?' crit':p<50?' warn':' ok');n.textContent=tl+'s';}if(tl<=0){clearInterval(timer);answers[pos]={sel:-1,ok:false,timedOut:true};streak=0;render();}},1000);}
}
function mcqSel(i){answers['tmp_'+pos]=i;render();}
function mcqSub(){var sel=answers['tmp_'+pos];if(sel===undefined)return;clearInterval(timer);var d=SEQ[pos],ok=sel===d.correct;answers[pos]={sel:sel,ok:ok,timedOut:false};delete answers['tmp_'+pos];if(ok){streak++;if(streak>bestStreak)bestStreak=streak;addXP(d.badge==='evaluate'?25:20);}else{streak=0;}render();}

// === END ===
function rEnd(){
  var correct=0,total=0;SEQ.forEach(function(d,i){if(d.type==='mcq'&&answers[i]){total++;if(answers[i].ok)correct++;}});
  var pct=total>0?Math.round(correct/total*100):0;
  var lv=LVLS[lvl];
  var h='<div style="text-align:center;padding-top:2rem;"><div style="font-family:\'JetBrains Mono\',monospace;font-size:.55rem;letter-spacing:.3em;color:var(--dim);text-transform:uppercase;">Part 3 Complete</div><div style="font-family:\'DM Serif Display\',Georgia,serif;font-size:2rem;color:var(--white);margin:.3rem 0;">'+lv.name+'</div><div style="font-size:.8rem;color:var(--mid);">'+xp+' XP · Best streak: '+bestStreak+'🔥</div></div>';
  h+='<div class="end-scores"><div class="end-sc"><div class="end-sc-num">'+correct+'<span style="font-size:1rem;color:var(--dim);">/'+total+'</span></div><div class="end-sc-label">Correct</div></div><div class="end-sc"><div class="end-sc-num">'+pct+'<span style="font-size:1rem;color:var(--dim);">%</span></div><div class="end-sc-label">Accuracy</div></div><div class="end-sc"><div class="end-sc-num" style="font-size:1.2rem;">'+(pct>=75?'Strong':pct>=50?'Building':'Developing')+'</div><div class="end-sc-label">Level</div></div></div>';

  h+='<div style="text-align:left;"><div class="sec-label">WHAT YOU NEED TO KNOW</div>';
  h+='<div class="card"><p style="font-size:.95rem;"><strong>Potsdam (July 1945):</strong> New leaders, the atomic bomb, broken election promises, reparations disputes — the alliance collapsed under multiple pressures at once.</p></div>';
  h+='<div class="card"><p style="font-size:.95rem;"><strong>Soviet expansion:</strong> By 1948, Stalin controlled Eastern Europe. He called it a "buffer zone" — the West called it an empire.</p></div>';
  h+='<div class="card"><p style="font-size:.95rem;"><strong>Source analysis:</strong> Churchill\'s "iron curtain" speech and Stalin\'s Pravda response show how the Cold War was fought through language. Same facts, opposite framing. Both are valuable — bias does not mean useless.</p></div></div>';

  h+='<div style="text-align:center;margin-top:1rem;">';
  if(pct>=60){
    h+='<button class="btn-p" onclick="showTeaser()" style="padding:.9rem 2.5rem;">Finish Part 3 →</button><br>';
    h+='<button class="btn-s" onclick="restart()" style="margin-top:.8rem;">Try again for a better score</button>';
  } else {
    h+='<div class="alert-card" style="text-align:center;margin-bottom:1rem;"><div style="font-family:\'JetBrains Mono\',monospace;font-size:.65rem;color:var(--red);margin-bottom:.3rem;">CLEARANCE DENIED</div><div style="font-size:.95rem;">You need 60% to proceed. Review the sources and try again.</div></div>';
    h+='<button class="btn-p" onclick="restart()">Retry Part 3 →</button>';
  }
  h+='</div>';
  app.innerHTML=h;
}

function showTeaser(){
  var o=document.createElement('div');
  o.style.cssText='position:fixed;inset:0;background:rgba(12,14,20,.97);z-index:300;display:flex;align-items:center;justify-content:center;animation:fadeIn .4s ease;overflow-y:auto;';
  o.innerHTML='<div style="max-width:500px;padding:2rem;text-align:center;"><div style="font-family:\'JetBrains Mono\',monospace;font-size:.55rem;letter-spacing:.3em;color:var(--amber);text-transform:uppercase;margin-bottom:1rem;">COMING UP IN PART 4</div><div style="font-family:\'DM Serif Display\',Georgia,serif;font-size:clamp(1.5rem,5vw,2.2rem);color:var(--white);line-height:1.3;font-style:italic;margin-bottom:1rem;">You can\'t undo what Stalin has done.<br>But you can stop him doing more.</div><div style="font-size:.95rem;color:var(--light);line-height:1.7;margin-bottom:1.5rem;">In Part 4, the West fights back — with money, military alliances, and a strategy called containment. You\'ll see why $13 billion was the most strategic investment in history.</div><button class="btn-s" onclick="this.closest(\'div[style]\').remove();restart();">Retry Part 3</button></div>';
  document.body.appendChild(o);
}

function restart(){xp=parseInt(params.get('xp'))||0;streak=0;bestStreak=0;lvl=parseInt(params.get('lvl'))||0;lvlShown=lvl;pos=0;answers={};wsiIdx=0;wsiDone=false;wsiAnswers=[];sortOrder=null;sortDone=false;render();}

render();
</script>
</body>
</html>
